name: DDA CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - integration/corporate-guest-checkout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_SITE_URL: https://example.invalid

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        run: |
          deno check --no-lock supabase/functions/create-payment/index.ts
          deno check --no-lock supabase/functions/payment-webhook/index.ts
          deno check --no-lock supabase/functions/start-account-payment/index.ts
          deno check --no-lock supabase/functions/check-account-payment-status/index.ts
          deno check --no-lock supabase/functions/check-guest-payment-status/index.ts
