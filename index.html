<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DORA DIGITAL ACADEMY</title>

  <meta name="description"
        content="DORA DIGITAL ACADEMY — Apprenez. Créez. Développez. Réussissez.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #123b72, #176b87);
      color: white;
      padding: 18px 6%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    .hero {
      background: linear-gradient(135deg, #eaf6ff, #ffffff);
      padding: 80px 6%;
    }

    .hero-content {
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 50px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      background: #dff4eb;
      color: #08764e;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(38px, 6vw, 68px);
      line-height: 1.05;
      margin-bottom: 22px;
      color: #123b72;
    }

    .hero p {
      font-size: 19px;
      color: #526071;
      max-width: 650px;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: #123b72;
      color: white;
    }

    .btn-secondary {
      background: white;
      color: #123b72;
      border: 1px solid #d5deea;
    }

    .hero-card {
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(18,59,114,.12);
    }

    .hero-card h3 {
      color: #123b72;
      margin-bottom: 15px;
    }

    .stat {
      padding: 15px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .stat:last-child {
      border-bottom: none;
    }

    .stat strong {
      display: block;
      font-size: 26px;
      color: #176b87;
    }

    section {
      padding: 70px 6%;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      color: #123b72;
      font-size: 36px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #687386;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(20,35,60,.07);
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eaf6ff;
      border-radius: 14px;
      font-size: 25px;
      margin-bottom: 18px;
    }

    .card h3 {
      color: #123b72;
      margin-bottom: 10px;
    }

    .card p {
      color: #697586;
      font-size: 15px;
    }

    .library {
      background: #eef6f8;
    }

    .ebook {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 30px;
      align-items: center;
    }

    .ebook-cover {
      min-height: 300px;
      border-radius: 20px;
      padding: 30px;
      background: linear-gradient(145deg, #123b72, #176b87);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .ebook-cover strong {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .ebook-info h2 {
      color: #123b72;
      margin-bottom: 15px;
      font-size: 32px;
    }

    .ebook-info p {
      color: #596579;
      margin-bottom: 20px;
    }

    .dashboard {
      background: #ffffff;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .dashboard-item {
      background: #f7f9fc;
      border: 1px solid #e7ebf1;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
    }

    .dashboard-item span {
      font-size: 30px;
      display: block;
      margin-bottom: 10px;
    }

    .dashboard-item strong {
      display: block;
      color: #123b72;
    }

    .cta {
      background: linear-gradient(135deg, #123b72, #176b87);
      color: white;
      text-align: center;
    }

    .cta h2 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .cta p {
      max-width: 650px;
      margin: 0 auto 25px;
      opacity: .9;
    }

    .cta .btn {
      background: white;
      color: #123b72;
    }

    footer {
      background: #0c203d;
      color: #cbd5e1;
      padding: 35px 6%;
      text-align: center;
    }

    footer strong {
      color: white;
    }

    @media (max-width: 850px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
      }

      nav a {
        margin-left: 0;
        margin-right: 12px;
      }

      .hero-content {
        grid-template-columns: 1fr;
      }

      .features {
        grid-template-columns: 1fr;
      }

      .dashboard-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .ebook {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      section {
        padding: 55px 5%;
      }

      .hero {
        padding: 55px 5%;
      }
    }
  </style>
</head>

<body>

<header>
  <nav>
    <div class="logo">DORA DIGITAL ACADEMY</div>

    <div>
      <a href="#accueil">Accueil</a>
      <a href="#formations">Formations</a>
      <a href="#bibliotheque">Bibliothèque</a>
      <a href="#espace">Mon espace</a>
    </div>
  </nav>
</header>

<main>

    <div class="hero-content">

      <div>
        <span class="badge">PLATEFORME DIGITALE DE FORMATION</span>

          Réussissez.
        </h1>

        <p>
          Bienvenue sur DORA DIGITAL ACADEMY, votre espace numérique
          pour apprendre, développer vos compétences et transformer
          vos idées en projets concrets.
        </p>
